workflows:
  ios-release:
    name: iOS release (IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.materialmanagement
      vars:
        # Replace with your App Store Connect app id (a number) after creating the app there.
        APP_STORE_APPLE_ID: "0000000000"
        XCODE_WORKSPACE: "ios/MaterialManagement.xcworkspace"
        XCODE_SCHEME: "MaterialManagement"
      node: lts
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install JavaScript dependencies
        script: |
          npm install
          npx expo install --fix
      - name: Generate native iOS project
        script: |
          npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Add your own email here if you want build notifications.
      # email:
      #   recipients:
      #     - you@example.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
